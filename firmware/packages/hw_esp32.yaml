# The real board: ESP32-C3-MINI-1-H4X, Wi-Fi, OTA, ADC. Secrets from secrets.yaml (git-ignored;
# copy secrets.example.yaml).

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key
  # Never reboot because Home Assistant is unreachable: every reboot turns all loads off
  # (restore_mode ALWAYS_OFF). The default would do it every 15 min (design review M5).
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s # keep reconnecting instead of rebooting (and switching loads off)
  ap:
    ssid: "${name}-setup"
    password: !secret fallback_ap_password

captive_portal:

binary_sensor:
  - platform: gpio
    id: hw_cutoff
    name: "Hardware over-temperature cutoff"
    pin:
      number: ${hw_overtemp_pin}
      inverted: ${hw_overtemp_inverted}
      mode: INPUT # 10k pull-up to 3V3 on the board (blocks/thermal_cutoff.py)
    filters:
      - delayed_on: 50ms # ignore glitches on the long trace; the hardware acts on its own anyway
    on_state:
      - script.execute: thermal_check

sensor:
  - platform: adc
    id: ntc_v
    pin: ${ntc_pin}
    attenuation: 12db
    update_interval: 5s
  - platform: internal_temperature
    name: "MCU temperature"
  - platform: wifi_signal
    name: "Wi-Fi signal"
    update_interval: 60s
