name: Bug report
description: Something in the hardware, firmware or docs is wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Mains-safety or security problems go to the private report instead** (Security tab).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Hardware (schematic/PCB), Firmware, Documentation, Fabrication files, Other]
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Board revision or commit
      placeholder: e.g. rev A, or commit 1a2b3c4
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, configuration, logs (ESPHome logs are welcome), measurements.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I tested with mains disconnected, or behind an isolation transformer / current-limited supply.
