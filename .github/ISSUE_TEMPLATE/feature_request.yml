name: Feature request
description: Propose an improvement to the board, firmware or docs.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: Does it touch the 230 VAC side, isolation, the protections or OTA/API security?
