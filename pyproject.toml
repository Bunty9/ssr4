[project]
name = "ssr4-firmware-tests"
version = "0.2.0"
description = "Test harness for the SSR4 firmware: runs the ESPHome PC build under labgrid"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8",
    "labgrid>=26.0.1",
    "aioesphomeapi>=46.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fwtest"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["firmware/tests"]
pythonpath = [".", "hardware/source"]   # fwtest/ and hardware/source/blocks/calc.py
